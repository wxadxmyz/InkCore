# ============================================================
#  墨核 AI Studio —— GitHub Actions 自动构建 Windows 发布包
#  用法：
#    1) 把代码推到 GitHub（公开仓库免费）
#    2) 打 tag：  git tag v1.2.0 && git push --tags
#    3) 本工作流自动在 Windows 云机器上：
#         - 装 Python 3.11 + 依赖
#         - PyInstaller 打包单文件 exe（dist\InkCore.exe）
#         - InnoSetup 生成安装包（installer\InkCore_Setup_*.exe）
#         - 额外打包绿色版  InkCore-win.zip
#         - 额外打包源码版  InkCore-src.zip
#         - 自动创建 GitHub Release 并附上四个产物
#    4) 用户可直接访问固定链接下载：
#         https://github.com/wxadxmyz/InkCore/releases/latest/download/InkCore-win.zip
#         https://github.com/wxadxmyz/InkCore/releases/latest/download/InkCore-src.zip
#  说明：模型权重不打进包（保持安装包仅几十 MB），首次使用由软件自动拉取。
# ============================================================
name: Build Windows Release

on:
  push:
    tags:
      - 'v*'                 # 推送 v1.2.0 这类 tag 时触发
  workflow_dispatch:         # 也支持在 Actions 页手动触发

permissions:
  contents: write            # 需要写 Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from version.json
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content version.json | ConvertFrom-Json).version
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # v2.4：内置模型推理库现在是「必须成功」的构建步骤。
      # 之前 continue-on-error 导致装不上也照常发包，用户下载后模型能下但跑不起来。
      # windows-latest 自带 MSVC Build Tools，wheel 缺失时可源码编译兜底；
      # 最后强制 import 验证，任何失败都中止构建，绝不产出缺引擎的安装包。
      - name: Install llama-cpp-python (本地内置模型推理库, 必须成功)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "优先安装预编译 wheel ..."
          $wheelOk = $true
          python -m pip install "llama-cpp-python>=0.2.0" --only-binary=:all:
          if ($LASTEXITCODE -ne 0) {
            Write-Host "预编译 wheel 不可用，尝试源码编译（windows-latest 自带 MSVC）..."
            $wheelOk = $false
            python -m pip install "llama-cpp-python>=0.2.0"
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::llama-cpp-python 安装彻底失败，中止构建（不再产出缺引擎的安装包）"
            exit 1
          }
          # 强制验证：导入成功才算库真的可用
          python -c "import llama_cpp, os; print('llama_cpp OK ->', os.path.dirname(llama_cpp.__file__))"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::无法导入 llama_cpp，打包版将无法运行内置模型，中止构建"
            exit 1
          }
          Write-Host ("内置模型推理库已就绪（预编译 wheel: " + $wheelOk + "）")

      - name: Build single-file exe (PyInstaller)
        run: pyinstaller build.spec

      - name: Build installer (Inno Setup, 版本号取自 version.json)
        id: inno
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $exe = "$env:RUNNER_TEMP\innosetup-7.0.2-x64.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "下载 Inno Setup 7.0.2 (官方公共 release, 无需鉴权) ..."
            curl.exe -L -o $exe "https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe"
          }
          if (-not (Test-Path $exe)) { Write-Host "::error::下载 Inno Setup 失败"; exit 1 }
          $isDir = "C:\IS7"
          if (-not (Test-Path "$isDir\ISCC.exe")) {
            Write-Host ("静默安装到 " + $isDir + " ...")
            Start-Process $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/DIR=$isDir" -Wait
          }
          $cands = @($isDir, "C:\Program Files (x86)\Inno Setup 7", "C:\Program Files\Inno Setup 7", "C:\Program Files (x86)\Inno Setup 6", "C:\Program Files\Inno Setup 6", "$env:LOCALAPPDATA\Programs\Inno Setup 7", "$env:LOCALAPPDATA\Programs\Inno Setup 6")
          $iscc = $cands | ForEach-Object { Get-ChildItem $_ -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue } | Select-Object -First 1
          if (-not $iscc) { Write-Host "::error::未找到 ISCC.exe，安装包构建失败"; exit 1 }
          Write-Host ("使用 ISCC: " + $iscc.FullName)
          # 用 version.json 的版本号覆盖 installer.iss 里写死的默认值，避免安装包名停留在 1.0.0
          $ver = "${{ steps.ver.outputs.version }}"
          $iss = Get-Content installer.iss -Raw -Encoding UTF8
          $iss = $iss -replace '(#define MyAppVersion\s+")[0-9.]+(")', ('${1}' + $ver + '${2}')
          Set-Content installer.iss -Value $iss -Encoding UTF8 -NoNewline
          Write-Host ("安装包版本已设为: " + $ver)
          & $iscc.FullName installer.iss
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::ISCC 编译 installer.iss 失败"; exit 1 }
          $out = Get-ChildItem installer/InkCore-Setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $out) { $out = Get-ChildItem installer/InkCore_Setup_*.exe -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $out) { Write-Host "::error::未生成 installer/InkCore-Setup.exe"; exit 1 }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $out.FullName release/ -Force
          Write-Host ("已生成安装包：" + $out.FullName)

      # 可选：代码签名（消除 SmartScreen “未知发布者” 警告）
      # 需先在仓库 Settings → Secrets 配置 CERT_BASE64 / CERT_PASSWORD，并把证书放进仓库
      # - name: Sign exe
      #   shell: pwsh
      #   run: |
      #     $b = [System.Convert]::FromBase64String("${{ secrets.CERT_BASE64 }}")
      #     [IO.File]::WriteAllBytes("cert.pfx", $b)
      #     & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" `
      #       sign /fd SHA256 /f cert.pfx /p "${{ secrets.CERT_PASSWORD }}" `
      #       /t http://timestamp.digicert.com dist\InkCore.exe

      - name: Package portable ZIP (InkCore-win.zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          # 绿色版内容：exe + 软件介绍 + README（让用户解压就知道怎么用）
          New-Item -ItemType Directory -Force -Path release\portable
          Copy-Item dist\InkCore.exe               release\portable\
          Copy-Item 'packaging\软件介绍.txt'        release\portable\
          Copy-Item README.md                      release\portable\
          Compress-Archive -Path release\portable\* -DestinationPath release\InkCore-win.zip -Force

      - name: Package source ZIP (InkCore-src.zip)
        shell: pwsh
        run: |
          $exclude = @('.git', '__pycache__', 'build', 'dist', 'release', '*.zip', 'MoHeAI',
                       '.venv', 'venv', 'env', 'node_modules', '_inkcore_dl', '_ui_gallery',
                       '_dl', '_refs', '.idea', '.vscode', '*.log', 'Thumbs.db', '.DS_Store')
          $files = Get-ChildItem -Force | Where-Object {
            $name = $_.Name
            $keep = $true
            foreach ($pat in $exclude) {
              if ($name -like $pat) { $keep = $false; break }
            }
            $keep
          }
          # 把软件介绍也放到源码包根目录一份，方便直接看到
          Copy-Item 'packaging\软件介绍.txt' . -Force
          Compress-Archive -Path ($files.FullName) -DestinationPath release\InkCore-src.zip -Force

      # v2.5：为每个产物额外生成「带版本号」的文件名（如 InkCore-Setup-v2.5.0.exe）。
      # 固定名 + 版本号名各留一份：固定名保证 latest/download 固定链接不失效，
      # 版本号名让用户下载后一眼看清版本，也便于本地同时保存多个版本。
      - name: Create versioned asset names (固定名 + 版本号名并存)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          Write-Host ("生成带版本号 v" + $ver + " 的产物副本 ...")
          $pairs = @(
            @{ src = "release/InkCore-Setup.exe"; dst = "release/InkCore-Setup-v$ver.exe" },
            @{ src = "dist/InkCore.exe";          dst = "release/InkCore-v$ver.exe" },
            @{ src = "release/InkCore-win.zip";   dst = "release/InkCore-win-v$ver.zip" },
            @{ src = "release/InkCore-src.zip";   dst = "release/InkCore-src-v$ver.zip" }
          )
          foreach ($p in $pairs) {
            if (Test-Path $p.src) {
              Copy-Item $p.src $p.dst -Force
              Write-Host ("  已生成: " + $p.dst)
            } else {
              Write-Host ("::warning::缺少源文件 " + $p.src + "，跳过")
            }
          }

      - name: Upload artifacts (手动触发时也有产物可下)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: InkCore-windows
          path: |
            release/InkCore-win.zip
            release/InkCore-src.zip
            dist/InkCore.exe
            installer/InkCore_Setup_*.exe

      - name: Create GitHub Release and upload assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 墨核 AI Studio ${{ github.ref_name }}
          fail_on_unmatched_files: false
          body: |
            ## 墨核 AI Studio ${{ github.ref_name }}
            > 本次版本：**v${{ steps.ver.outputs.version }}**。每个产物提供两种文件名：
            > **带版本号名**（如 InkCore-Setup-v${{ steps.ver.outputs.version }}.exe，便于辨识和同时保存多版本）
            > 与**固定名**（如 InkCore-Setup.exe，固定下载链接始终指向最新版）。两者内容完全相同。

            - **InkCore-Setup.exe** / InkCore-Setup-v${{ steps.ver.outputs.version }}.exe：安装版，推荐大多数用户
            - **InkCore.exe** / InkCore-v${{ steps.ver.outputs.version }}.exe：单文件版，双击即用（无需安装）
            - **InkCore-win.zip** / InkCore-win-v${{ steps.ver.outputs.version }}.zip：免安装绿色版，解压即用，适合放 U 盘
            - **InkCore-src.zip** / InkCore-src-v${{ steps.ver.outputs.version }}.zip：源码压缩包，可在 Python 环境直接运行
            - 首次启动若选用「本地内置模型」，会自动下载约 1.1GB 量化权重，之后永久离线可用。
          files: |
            release/InkCore-win.zip
            release/InkCore-src.zip
            release/InkCore-win-v${{ steps.ver.outputs.version }}.zip
            release/InkCore-src-v${{ steps.ver.outputs.version }}.zip
            dist/InkCore.exe
            release/InkCore-v${{ steps.ver.outputs.version }}.exe
            installer/InkCore-Setup.exe
            installer/InkCore_Setup_*.exe
            release/InkCore_Setup_*.exe
            release/InkCore-Setup.exe
            release/InkCore-Setup-v${{ steps.ver.outputs.version }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
