# 代码质量检查：每次 push / PR 都跑，避免半成品进 main
name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install flask requests beautifulsoup4 python-docx reportlab pypdf pytest ruff
      - name: Syntax check
        run: |
          python -m py_compile app.py local_llm.py desktop_app.py
      - name: Lint (fatal errors only)
        run: |
          python -m ruff check --select E9,F63,F7,F82 app.py local_llm.py desktop_app.py tests/
      - name: Unit tests
        run: |
          python -m pytest tests/ -q
